<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="shortcut icon" href="static/MiniIcon.png" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор уровня сложности</title>
    <style>
        html {
        overflow-y: hidden;
        }
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background:
                linear-gradient(rgba(0,255,0,0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,0,0.1) 1px, transparent 1px),
                #e0f7fa;
            background-size: 100px 100px;
            position: relative;
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: #2196F3;
            color: white;
            border: 2px solid #333;
            border-radius: 8px;
            cursor: pointer;
            background-color: rgba(68, 114, 196, 1);
            color: White;
            border: 1pt solid rgba(173, 216, 230, 0);
            font-size: 42px;
            font-family: 'Comic Sans MS';
            cursor: pointer;
            text-decoration: none;
            border-radius: 15px;
            box-shadow: 0 1pt 4pt rgba(0, 0, 0, 0.57);
            position: relative;
            overflow: hidden;
        }

        .back-button::before {
            content: '';
            position: absolute;
            top: -6pt;
            left: 0;
            right: 0;
            height: 6pt;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0));
            border-radius: 15px 15px 0 0;
        }
        .back-button::after {
            content: '';
            position: absolute;
            bottom: -6pt;
            left: 0;
            right: 0;
            height: 6pt;
            background: radial-gradient(circle, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 0 0 15px 15px;
        }


        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 90vh;
        }

        h1 {
            color: #333;
            margin-bottom: 100px;
            font-size: 80px
        }

        .difficulty-buttons {
            display: flex;
            gap: 20px;
        }

        .difficulty-button {
            padding: 180px 90px;
            border: none;
            border-radius: 90px;
            cursor: pointer;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            font-size: 90px;
            color: black;
            transition: filter 0.3s;

            cursor: pointer;
            background-color: rgba(68, 114, 196, 1);
            color: White;
            border: 1pt solid rgba(173, 216, 230, 0);
            font-family: 'Comic Sans MS';
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 1pt 4pt rgba(0, 0, 0, 0.57);
            position: relative;
            overflow: hidden;
        }
        .difficulty-button::before {
            content: '';
            position: absolute;
            top: -6pt;
            left: 0;
            right: 0;
            height: 6pt;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0));
            border-radius: 15px 15px 0 0;
        }
        .difficulty-button::after {
            content: '';
            position: absolute;
            bottom: -6pt;
            left: 0;
            right: 0;
            height: 6pt;
            background: radial-gradient(circle, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 0 0 15px 15px;
        }


        .difficulty-button:hover {
            filter: brightness(90%);
        }

        #easy {
            background-color: #8BC34A;
        }

        #medium {
            background-color: #FFEB3B;
        }

        #hard {
            background-color: #F44336;
        }
        .grid {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }

        .grid:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: linear-gradient(90deg, rgba(0, 128, 0, 0.2) 1px, transparent 1px),
                              linear-gradient(180deg, rgba(0, 128, 0, 0.2) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="grid"></div>
    <button class="back-button" onclick="location.href = '{{ url_for('main') }}'">Назад</button>

    <div class="container">
        <h1>Выберите уровень сложности:</h1>

        <div class="difficulty-buttons">
            {% for level in ['Легкий', 'Средний', 'Сложный'] %}
            <button class="difficulty-button" id="{{ level.lower() }}"
                    onclick="location.href = '{{ url_for('training', difficulty=level) }}'">
                {{ level }}
            </button>
            {% endfor %}
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="shortcut icon" href="static/MiniIcon.png" />
    <meta charset="UTF-8">
    <title>Ошибки результата</title>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        html {
        overflow-y: hidden;
        }
        body {
           font-family: 'Comic Sans MS', cursive;
            margin: 0;
            min-height: 100vh;
            background:
                linear-gradient(rgba(0,255,0,0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,0,0.1) 1px, transparent 1px),
                #e0f7fa;
            background-size: 100px 100px;
            position: relative;
            padding: 20px;
        }
        .name {
            font-size: 32px;
            text-align: center;
            line-height: 2;
            margin-bottom: 0px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 50px;
        }

        .header button {
            width: 240px;
            height: 80px;
            border: 2px solid #333;
            background: none;
            margin: 20px 20px;
            border-radius: 8px;
            cursor: pointer;
            background-color: rgba(68, 114, 196, 1); /* Сплошная заливка (голубой, прозрачность 0%) */
            color: White; /* Цвет текста (прозрачный) */
            border: 1pt solid rgba(173, 216, 230, 0); /* Сплошная линия, голубой цвет, прозрачность 0% */
            font-size: 42px; /* Размер шрифта */
            font-family: 'Comic Sans MS';
            cursor: pointer; /* Указатель мыши */
            text-decoration: none; /* Убираем подчеркивание */
            border-radius: 15px; /* Скругленные углы */
            box-shadow: 0 1pt 4pt rgba(0, 0, 0, 0.57); /* Тень */
            position: relative; /* Для эффекта рельефа */
            overflow: hidden; /* Для обрезки рельефа */
        }



        .content {
            text-align: center;
            margin-top: 20px;
            width: 90%;

        }

        .title {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 0px;
            text-align: center;
        }

        .list {
            text-align: left;
            font-size: 28px;
            margin-top: 20px;
            margin-left: 20px;
        }

        .list-item {
            margin-bottom: 20px;
            text-align: left;
        }

        .list-item .formula {
            margin-right: 2400px;
            font-size: 20px;
            font-weight: bold;
        }

        .list-item .wrong-answer {
            color: red;
        }

        .list-item .correct-answer {
            color: green;
        }

        .grid {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none; /* чтобы сетка не мешала взаимодействию с другими элементами */
        }

        .grid:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: linear-gradient(90deg, rgba(0, 128, 0, 0.2) 1px, transparent 1px),
                              linear-gradient(180deg, rgba(0, 128, 0, 0.2) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }

        .scrollable-list {
            flex-grow: 1;
            height: calc(100% - 20px);
            max-height: 650px;
            overflow-y: auto;
            padding: 10px;
            border-radius: 15px;
            margin-down: 5%;
        }

        .scrollable-list::-webkit-scrollbar {
            width: 12px;
        }

        .scrollable-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 15px;
        }

        .scrollable-list::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 15px;
        }

        .scrollable-list::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

    </style>
</head>
<body>
    <div class="grid"></div>
    <div class="header">
        <button onclick="location.href = '{{ url_for('result') }}'">Назад</button>
        <div class="name">{{ settings.profile_name }}</div>
        <button onclick="location.href = '{{ url_for('training', difficulty=session.difficulty) }}'">Повторить</button>
    </div>
    <div class="title">Ошибки результата</div>
    <div class="scrollable-list">
    <ul>
        {% for error in mistakes %}
            <li class="list-item">
                <div class="formula">$${{ error.question }}$$</div>
                <div class="wrong-answer"><b>Ваш ответ:</b> {{ error.user_answer }}</div>
                <div class="correct-answer"><b>Правильный ответ:</b> {{ error.correct_answer }}</div>
            </li>
        {% endfor %}
    </ul>
</div>
<script>
        MathJax.typeset();
    </script>
</body>
</html>
